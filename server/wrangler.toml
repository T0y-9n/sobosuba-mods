# Local development only. No account or production database is configured.
name = "sobosuba-ranking-local"
main = "src/index.ts"
compatibility_date = "2026-10-29"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "prime-sobo-local"
database_id = "local-only"
migrations_dir = "migrations"

[observability]
enabled = false

# Separate native pre-D1 budgets; namespace IDs distinguish GET and POST.
[[ratelimits]]
name = "POST_RATE"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GET_RATE"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
