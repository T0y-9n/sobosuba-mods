name: Publish catalog validation

on:
  workflow_run:
    workflows:
      - Catalog validation
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind the latest trusted validation result to the current PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          repository = 'T0y-9n/sobosuba-mods'
          workflow_path = '.github/workflows/catalog-check.yml'
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if event['repository']['full_name'] != repository:
              raise ValueError('Unexpected repository')
          run_id = event['workflow_run']['id']
          if type(run_id) is not int or run_id <= 0:
              raise ValueError('Invalid workflow run ID')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, url):
                  return None

          api_opener = urllib.request.build_opener(NoRedirect)

          def read_limited(response, limit):
              body = response.read(limit + 1)
              if len(body) > limit:
                  raise ValueError('GitHub response exceeds size limit')
              return body

          def api(path, body=None, binary=False, limit=1024 * 1024, artifact=False, method=None):
              url = 'https://api.github.com/repos/' + path
              headers = {
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github.raw+json' if binary and not artifact else 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'Sobosuba-Catalog-Validation-Publisher',
              }
              payload = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(url, headers=headers, data=payload, method=method)
              try:
                  with api_opener.open(request, timeout=30) as response:
                      result = read_limited(response, limit)
              except urllib.error.HTTPError as error:
                  if not artifact or error.code != 302:
                      raise
                  location = error.headers['Location']
                  parsed = urllib.parse.urlsplit(location)
                  if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password:
                      raise ValueError('Invalid artifact download URL')
                  # The signed download receives no GitHub authorization header.
                  with urllib.request.urlopen(location, timeout=30) as response:
                      result = read_limited(response, limit)
              return result if binary else json.loads(result)

          workflow = api(repository + '/actions/workflows/catalog-check.yml')
          run = api(repository + '/actions/runs/' + str(run_id))
          if (workflow.get('path') != workflow_path or workflow.get('state') != 'active'
                  or run.get('workflow_id') != workflow['id'] or run.get('path') != workflow_path
                  or run.get('event') != 'pull_request_target'
                  or run.get('repository', {}).get('full_name') != repository):
              raise ValueError('Unexpected validation workflow run')
          title = run.get('display_title', '')
          identity = re.fullmatch(r'Catalog PR #([1-9][0-9]*) at ([0-9a-f]{40})', title)
          if identity is None:
              raise ValueError('Invalid trusted validation run name')
          pull_number = int(identity[1])
          head_sha = identity[2]
          main_sha = api(repository + '/git/ref/heads/main')['object']['sha']
          references = [item for item in run.get('pull_requests', []) if item.get('number') == pull_number]
          if (run.get('head_sha') != head_sha or len(references) != 1
                  or references[0].get('base', {}).get('sha') != main_sha
                  or references[0].get('head', {}).get('sha') != head_sha):
              raise ValueError('Validation run does not match the PR head and current main')
          pull_path = repository + '/pulls/' + str(pull_number)

          def validate_current_pull():
              pull = api(pull_path)
              if (pull.get('state') != 'open' or pull['base']['ref'] != 'main'
                      or pull['base']['repo']['full_name'] != repository
                      or pull['base']['sha'] != main_sha or pull['head']['sha'] != head_sha):
                  raise ValueError('PR changed since validation')
              if api(repository + '/git/ref/heads/main')['object']['sha'] != main_sha:
                  raise ValueError('Main changed since validation')
              return pull

          def run_key(item):
              return (item.get('run_started_at') or item.get('created_at') or '',
                      item['id'], item.get('run_attempt', 1))

          def validate_latest_run():
              matching = []
              page = 1
              while True:
                  runs = api(repository + '/actions/workflows/' + str(workflow['id'])
                             + '/runs?event=pull_request_target&per_page=100&page=' + str(page),
                             limit=8 * 1024 * 1024)
                  rows = runs.get('workflow_runs', [])
                  matching.extend(item for item in rows
                                  if item.get('workflow_id') == workflow['id']
                                  and item.get('event') == 'pull_request_target'
                                  and item.get('path') == workflow_path
                                  and item.get('repository', {}).get('full_name') == repository
                                  and item.get('display_title') == title)
                  if len(rows) < 100:
                      break
                  page += 1
              if not matching or run_key(max(matching, key=run_key)) != run_key(run):
                  raise ValueError('A newer validation run exists')
              current = api(repository + '/actions/runs/' + str(run_id))
              if any(current.get(field) != run.get(field)
                     for field in ('run_attempt', 'status', 'conclusion', 'run_started_at')):
                  raise ValueError('Validation run changed while publishing')

          pull = validate_current_pull()
          validate_latest_run()
          succeeded = run.get('status') == 'completed' and run.get('conclusion') == 'success'
          failed = run.get('status') == 'completed' and not succeeded
          check = {
              'name': 'catalog-validation',
              'head_sha': head_sha,
              'status': 'completed' if failed else 'in_progress',
              'external_id': f"catalog-validation:{run_id}:{run['run_attempt']}:{main_sha}",
              'details_url': f'https://github.com/{repository}/actions/runs/{run_id}',
              'output': {
                  'title': 'Catalog package validation failed' if failed else 'Catalog package validation in progress',
                  'summary': 'Latest trusted validation result for main ' + main_sha + '.',
              },
          }
          if failed:
              check['conclusion'] = 'failure'
          published = api(repository + '/check-runs', check)
          if not succeeded:
              print('Published current validation state for PR ' + str(pull_number))
              raise SystemExit(0)

          artifacts = api(repository + '/actions/runs/' + str(run_id) + '/artifacts?per_page=100')
          candidates = [item for item in artifacts.get('artifacts', [])
                        if item.get('name') == 'catalog-validation-' + head_sha
                        and not item.get('expired') and 0 < item.get('size_in_bytes', 0) <= 1024 * 1024]
          if len(candidates) != 1:
              raise ValueError('Expected one validation artifact')
          artifact = candidates[0]
          archive_bytes = api(repository + '/actions/artifacts/' + str(artifact['id']) + '/zip',
                              binary=True, artifact=True)
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              if archive.namelist() != ['catalog-validation.json'] or archive.infolist()[0].file_size > 65536:
                  raise ValueError('Invalid validation artifact contents')
              proof = json.loads(archive.read('catalog-validation.json'))
          if not isinstance(proof, dict):
              raise ValueError('Invalid validation record')
          for field in ('pull_request_number', 'run_id', 'run_attempt', 'checker_exit_code'):
              if type(proof.get(field)) is not int:
                  raise ValueError('Invalid validation record number')
          head_repository = pull['head']['repo']['full_name']
          input_sha256 = proof.get('input_sha256', '')
          if (not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', head_repository)
                  or not re.fullmatch(r'[0-9a-f]{64}', input_sha256)):
              raise ValueError('Invalid validation record identity')
          expected = {
              'repository': repository, 'event_name': 'pull_request_target',
              'pull_request_number': pull_number, 'head_repository': head_repository,
              'head_sha': head_sha, 'base_sha': main_sha,
              'run_id': run_id, 'run_attempt': run['run_attempt'],
              'checker_exit_code': 0, 'conclusion': 'success',
          }
          if any(proof.get(key) != value for key, value in expected.items()):
              raise ValueError('Validation record does not match trusted run')
          content_path = head_repository + '/contents/catalog.json?' + urllib.parse.urlencode({'ref': head_sha})
          content = api(content_path, binary=True, limit=8 * 1024 * 1024)
          if hashlib.sha256(content).hexdigest() != input_sha256:
              raise ValueError('PR catalog differs from validated input')
          validate_current_pull()
          validate_latest_run()
          api(repository + '/check-runs/' + str(published['id']), {
              'status': 'completed',
              'conclusion': 'success',
              'output': {
                  'title': 'Catalog package validation succeeded',
                  'summary': f'Validated catalog SHA256 {input_sha256} against main {main_sha}.',
              },
          }, method='PATCH')
          print('Published validated catalog result for PR ' + str(pull_number))
          PY
